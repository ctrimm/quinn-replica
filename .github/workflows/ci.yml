name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.4"

jobs:
  # ── 1. Unit + integration tests ──────────────────────────────────────────
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (incl. real production builds, root + Pages subpath)
        run: npm run test:integration

  # ── 2. End-to-end tests (Playwright, real browser, production build) ────
  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  # ── 3. Lighthouse grading ────────────────────────────────────────────────
  # Accessibility, Best Practices and SEO hard-fail below 100. Performance
  # is reported, not gated — the same stance as astro-gov-starter's
  # lighthouserc.json — because the score tracks the shared runner's CPU
  # more than the site (10 ms blocking locally vs 730 ms in CI, same code).
  # `npm run grade` locally holds the strict all-100 bar.
  lighthouse:
    name: Lighthouse (a11y / BP / SEO = 100, perf reported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Grade
        run: npm run grade:ci
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/lighthouse/
          retention-days: 14
